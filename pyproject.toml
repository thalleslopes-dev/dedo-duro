[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dedo-duro"
version = "0.3.0"
description = "Te dedura quando o dedo vai pra boca: alerta local (webcam + MediaPipe) para parar de roer unha."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thalles Lopes" }]
keywords = ["nail-biting", "habit", "mediapipe", "computer-vision", "windows"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Win32 (MS Windows)",
    "Topic :: Utilities",
]
dependencies = [
    "mediapipe==1.2.2",
    "opencv-python>=4.10,<6",
    "numpy>=1.26,<3",
    "pillow>=10,<14",
    "pystray>=0.19,<0.20",
    "scikit-learn>=1.4,<2",
    "joblib>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.gui-scripts]
dedo-duro = "dedo_duro.cli:main"   # gera dedo-duro.exe sem janela de console

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dedo_duro = ["recursos/*"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
